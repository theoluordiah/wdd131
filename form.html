<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Leave a review for a product you have used.">
    <meta name="author" content="Oluchukwu Ordiah">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating">
                <legend>Overall Rating *</legend>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1" title="1 star">&star;<span class="sr-only">1 star</span></label>
                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating2" title="2 stars">&star;<span class="sr-only">2 stars</span></label>
                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating3" title="3 stars">&star;<span class="sr-only">3 stars</span></label>
                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating4" title="4 stars">&star;<span class="sr-only">4 stars</span></label>
                <input type="radio" id="rating5" name="rating" value="5">
                <label for="rating5" title="5 stars">&star;<span class="sr-only">5 stars</span></label>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <label class="check"><input type="checkbox" id="durable" name="features" value="Durable"> Durable</label>
                <label class="check"><input type="checkbox" id="easy" name="features" value="Easy to use"> Easy to use</label>
                <label class="check"><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
                <label class="check"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5"></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> Oluchukwu Ordiah, Lagos, Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
